# Card-Krueger NJ-PA asgari ücret — minik 2×2 fixture (CI smoke matrisi).
# Rol: hızlı test + genelleme garantisi (SCOPE §11); hero ya da flip seti DEĞİL.
# Ham dosya GENİŞ formatta (iki görüşme dalgası aynı satırda, `2` sonekli kolonlar).
# unit×time uzun panele reshape `fetch_data.py`'de türev extract olarak yapılır: keyfi reshape
# vetted transform kataloğunun kapsamı dışı, panel-merge ise spine'da unit×time ister.

dataset: card_krueger
description: >
  NJ asgari ücret artışının (Nisan 1992) fast-food istihdamına etkisi
  (Card & Krueger 1994). 410 restoran × 2 dalga (Şub/Mar 1992 öncesi,
  Kas/Ara 1992 sonrası), NJ = tedavi, PA = kontrol. Klasik 2×2 DiD.

sources:
  njmin:
    file: raw/card_krueger_long.csv          # raw/card_krueger.csv'den uzun panel türevi (fetch_data.py)
    format: csv
    note: >
      Kaynak: davidcard.berkeley.edu/data_sets/njmin.zip. Kolon tanımları
      raw/codebook dosyasında; '.' → NA çevrildi. Uzun türevde her mağaza iki satır
      (wave 1/2); FTE = EMPFT + NMGRS + 0.5*EMPPT (makaledeki tanım), kalıcı kapanan
      mağaza (STATUS2=3) dalga 2'de FTE=0.
    columns:
      store_id: "store_id"                   # arşiv satır sırası; SHEET tekil değil (409/410)
      sheet: "sheet"                         # ham anket sayfa numarası, izlenebilirlik için
      wave: "wave"                           # {1, 2} — DATE2 gerçek tarih verir
      fte_employment: "fte_employment"
      treated_state: "treated_state"         # 1 = NJ (tedavi), 0 = PA (kontrol)
      treated_post: "treated_post"           # tedavi dummy'si: treated_state=1 & wave=2
      chain: "chain"                         # 1=BK 2=KFC 3=Roys 4=Wendys
      co_owned: "co_owned"
      wage_start: "wage_start"

panel:
  unit: store_id
  time: wave
  outcome: [fte_employment]
  covariates: [chain, co_owned]
  weight: null

treatment:
  # `cohort_from` yok: iki dönemli 2×2'de tedavi kohortu bir YIL değil, dalga numarası;
  # merge'ün kohort türetmesi yıl semantiği bekler. Gösterge veride hazır olduğu için
  # kohort makinesine gerek yok, `indicator_from` ile doğrudan bildirilir.
  indicator_from: treated_post
  never_treated_when: { treated_state: "0" }   # tırnak şart: merge kaynakları dtype=str okur
